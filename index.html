<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mein Player</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#171629">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Player">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#171629;--panel:#211f3d;--line:#34315c;--tx:#ece9ff;--mut:#9d98c9;--acc:#ff7aa8;--ok:#7ad7c4;font-family:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{height:100dvh;background:var(--bg);color:var(--tx);display:grid;grid-template-columns:240px 1fr;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"side main" "bar bar"}
button,select,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
aside{grid-area:side;background:var(--panel);padding:22px 14px;overflow:auto;border-right:1px solid var(--line)}
aside h2{margin:0 8px 18px;font-size:1.15rem;letter-spacing:.02em}
.nav{display:flex;justify-content:space-between;gap:8px;width:100%;padding:9px 10px;border-radius:8px;text-align:left;color:var(--mut)}
.nav:hover{background:var(--bg);color:var(--tx)}
.nav[aria-current=page]{background:var(--bg);color:var(--tx);box-shadow:inset 3px 0 var(--acc)}
.nav .n{font-variant-numeric:tabular-nums}
.new{display:flex;gap:6px;margin-top:16px;padding:0 4px}
.new input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
main{grid-area:main;overflow:auto;padding:26px 30px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{margin:0;font-size:1.7rem;letter-spacing:-.01em}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);border-radius:8px;padding:8px 14px}
.btn:hover{background:var(--panel)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#2a0f1b;font-weight:600}
.btn.warn{border-color:var(--acc);color:var(--acc)}
.note,.empty{color:var(--mut);line-height:1.5;max-width:60ch}
.empty{margin-top:28px}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.name{display:flex;gap:14px;align-items:center;width:100%;padding:12px 4px;text-align:left;min-width:0}
.idx{width:26px;flex:none;color:var(--mut);font-variant-numeric:tabular-nums;text-align:right}
.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.on .t,.row.on .idx{color:var(--acc)}
.row .act{display:flex;gap:4px;align-items:center}
.row select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--mut);max-width:150px}
.sm{color:var(--mut);padding:7px 9px;border-radius:6px}
.sm:hover{color:var(--tx);background:var(--panel)}
.sm.warn{color:var(--acc)}
#bar{grid-area:bar;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:20px;padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);border-top:1px solid var(--line)}
.ttl{font-weight:600;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm{display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.85rem;font-variant-numeric:tabular-nums}
input[type=range]{accent-color:var(--acc);flex:1;min-width:0}
.ctl{display:flex;align-items:center;gap:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--tx);position:relative}
.ib:hover{background:var(--bg)}
.ib[aria-pressed=true]{color:var(--ok)}
.ib.play{width:54px;height:54px;background:var(--acc);color:#2a0f1b}
.ib.play:hover{background:var(--acc);filter:brightness(1.08)}
.ib b{position:absolute;right:7px;bottom:6px;font-size:.65rem}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px;color:var(--mut);font-size:.85rem}
.vol input{flex:none;width:110px}
#flash{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px}
#flash:empty{display:none}
@media(max-width:700px){
body{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;grid-template-areas:"side" "main" "bar"}
aside{max-height:36vh;border-right:0;border-bottom:1px solid var(--line);padding:14px 10px}
aside h2{margin-bottom:8px}
main{padding:18px 14px}
#bar{grid-template-columns:1fr;gap:8px}
.ctl{justify-content:center}
.vol{display:none}
.row select{max-width:110px}
#flash{bottom:190px}
}
</style>
</head>
<body>
<aside id="side"></aside>
<main id="main"></main>
<footer id="bar">
  <div>
    <div class="ttl" id="ttl">Nichts ausgewählt</div>
    <div class="tm"><span id="tCur">0:00</span><input id="seek" type="range" min="0" max="0" step="0.1" value="0" aria-label="Position im Song"><span id="tDur">0:00</span></div>
  </div>
  <div class="ctl">
    <button class="ib" id="bShuf" title="Zufällige Reihenfolge" aria-label="Zufällige Reihenfolge" aria-pressed="false"></button>
    <button class="ib" id="bPrev" title="Ein Song zurück" aria-label="Ein Song zurück"></button>
    <button class="ib play" id="bPlay" aria-label="Abspielen"></button>
    <button class="ib" id="bNext" title="Nächster Song" aria-label="Nächster Song"></button>
    <button class="ib" id="bRep" aria-label="Wiederholen" aria-pressed="false"><span id="rb"></span></button>
  </div>
  <label class="vol">Lautstärke <input id="vol" type="range" min="0" max="1" step="0.01" value="1"></label>
</footer>
<div id="flash" role="status"></div>
<input type="file" id="fileIn" accept="audio/*,.mp3,.m4a,.wav,.ogg,.flac,.aac,.opus" multiple hidden>
<script>
if ('serviceWorker' in navigator) { addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
const $ = s => document.querySelector(s);
const h = (t, p = {}, ...c) => {
  const e = document.createElement(t);
  for (const k in p) {
    if (p[k] == null || p[k] === false) continue;
    if (k.startsWith('on')) e.addEventListener(k.slice(2), p[k]);
    else if (k === 'class') e.className = p[k];
    else if (k in e) e[k] = p[k];
    else e.setAttribute(k, p[k]);
  }
  e.append(...c.flat().filter(x => x != null && x !== false));
  return e;
};
const svg = (b, fill) => `<svg viewBox="0 0 24 24" width="22" height="22" ${fill ? 'fill="currentColor"' : 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"'} aria-hidden="true">${b}</svg>`;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = t => { if (!isFinite(t)) return '0:00'; const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); };

let songs = [], lists = [], view = 'all', queue = [], order = [], pos = -1;
let shuffle = false, repeat = 0, curId = null, url = null, armed = null, memOnly = false, dragging = false, ft;
const audio = new Audio();
const ttl = $('#ttl'), seek = $('#seek'), tCur = $('#tCur'), tDur = $('#tDur'), bPlay = $('#bPlay'), bShuf = $('#bShuf'), bRep = $('#bRep'), fileIn = $('#fileIn');

/* Speicher: alles bleibt im Browser (IndexedDB) */
const dbp = new Promise(r => {
  try {
    const q = indexedDB.open('musikplayer', 1);
    q.onupgradeneeded = () => { q.result.createObjectStore('songs', { keyPath: 'id' }); q.result.createObjectStore('playlists', { keyPath: 'id' }); };
    q.onsuccess = () => r(q.result);
    q.onerror = () => r(null);
  } catch (e) { r(null); }
});
const db = (st, mode, fn) => dbp.then(d => d ? new Promise(res => {
  try { const t = d.transaction(st, mode), rq = fn(t.objectStore(st)); t.oncomplete = () => res(rq.result); t.onerror = () => res(undefined); t.onabort = () => res(undefined); }
  catch (e) { res(undefined); }
}) : undefined);

const flash = txt => { const f = $('#flash'); f.textContent = txt; clearTimeout(ft); ft = setTimeout(() => f.textContent = '', 6000); };
const curSongs = () => view === 'all' ? songs : ((lists.find(l => l.id === view) || {}).ids || []).map(id => songs.find(s => s.id === id)).filter(Boolean);
const arm = (k, fn) => () => {
  if (armed === k) { armed = null; fn(); }
  else { armed = k; render(); setTimeout(() => { if (armed === k) { armed = null; render(); } }, 3000); }
};

/* Songs und Playlists verwalten */
async function addFiles(files) {
  let n = 0, bad = 0;
  for (const f of files) {
    if (!f.type.startsWith('audio/') && !/\.(mp3|m4a|wav|ogg|flac|aac|opus)$/i.test(f.name)) continue;
    const ext = (f.name.match(/\.([^.]+)$/) || [])[1] || '';
    const type = f.type || ({ mp3: 'audio/mpeg', m4a: 'audio/mp4', wav: 'audio/wav', ogg: 'audio/ogg', opus: 'audio/ogg', flac: 'audio/flac', aac: 'audio/aac' })[ext.toLowerCase()] || 'audio/mpeg';
    const data = await f.arrayBuffer();
    const s = { id: uid(), name: f.name.replace(/\.[^.]+$/, ''), blob: new Blob([data], { type }), added: Date.now() };
    songs.push(s); n++;
    const ok = await db('songs', 'readwrite', st => st.put({ id: s.id, name: s.name, type, data, added: s.added }));
    if (ok === undefined) bad++;
  }
  render();
  flash(bad ? 'Speichern fehlgeschlagen: ' + bad + ' Song(s) bleiben nur bis zum Neuladen' : n ? n + (n === 1 ? ' Song hinzugefügt' : ' Songs hinzugefügt') : 'Keine Audiodateien gefunden');
}
const saveList = l => db('playlists', 'readwrite', s => s.put(l));
async function mkList() {
  const name = nn.value.trim(); if (!name) return;
  const l = { id: uid(), name, ids: [] };
  lists.push(l); nn.value = ''; view = l.id; await saveList(l); render();
}
async function addTo(listId, songId) {
  const l = lists.find(x => x.id === listId), s = songs.find(x => x.id === songId);
  if (!l || !s) return;
  if (l.ids.includes(songId)) flash('Schon in „' + l.name + '“');
  else { l.ids.push(songId); await saveList(l); flash('Zu „' + l.name + '“ hinzugefügt'); }
  render();
}
async function rmFrom(songId) {
  const l = lists.find(x => x.id === view); if (!l) return;
  l.ids = l.ids.filter(x => x !== songId); await saveList(l);
  if (curId === songId || queue.includes(songId)) { /* läuft weiter in der Warteschlange */ }
  render();
}
async function delList() {
  const id = view; lists = lists.filter(x => x.id !== id); view = 'all';
  await db('playlists', 'readwrite', s => s.delete(id)); render();
}
async function delSong(id) {
  songs = songs.filter(s => s.id !== id);
  await db('songs', 'readwrite', s => s.delete(id));
  for (const l of lists) if (l.ids.includes(id)) { l.ids = l.ids.filter(x => x !== id); await saveList(l); }
  if (curId === id) { audio.pause(); audio.removeAttribute('src'); curId = null; queue = []; order = []; pos = -1; }
  else if (curId) { queue = queue.filter(x => x !== id); build(curId); }
  updateBar(); render();
}

/* Wiedergabe */
function build(startId) {
  const n = queue.length, i = Math.max(0, queue.indexOf(startId));
  if (shuffle) {
    const r = [...Array(n).keys()].filter(x => x !== i);
    for (let k = r.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [r[k], r[j]] = [r[j], r[k]]; }
    order = [i, ...r]; pos = 0;
  } else { order = [...Array(n).keys()]; pos = i; }
}
function playFrom(ids, startId) {
  queue = ids.slice(); if (!queue.length) return;
  build(startId || queue[0]); load();
}
function load() {
  const s = songs.find(x => x.id === queue[order[pos]]); if (!s) return;
  curId = s.id;
  if (url) URL.revokeObjectURL(url);
  url = URL.createObjectURL(s.blob);
  audio.src = url; audio.play().catch(() => {});
  if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: s.name });
  updateBar(); render();
}
function next(auto) {
  if (!queue.length) return;
  if (pos < order.length - 1) { pos++; load(); }
  else if (repeat === 1 || !auto) {
    if (shuffle) build(queue[Math.floor(Math.random() * queue.length)]); else pos = 0;
    load();
  } else { audio.pause(); audio.currentTime = 0; updateBar(); }
}
function prev() {
  if (!curId) return;
  if (audio.currentTime > 3 || pos <= 0) { audio.currentTime = 0; return; }
  pos--; load();
}
function toggle() {
  if (!curId) { playFrom(curSongs().map(x => x.id)); return; }
  audio.paused ? audio.play() : audio.pause();
}

/* Leiste unten */
bShuf.innerHTML = svg('<path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/>');
$('#bPrev').innerHTML = svg('<path d="M6 5h2v14H6zM20 5v14L9 12z"/>', 1);
$('#bNext').innerHTML = svg('<path d="M16 5h2v14h-2zM4 5v14l11-7z"/>', 1);
$('#rb').innerHTML = svg('<path d="M17 2l4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>');
function updateBar() {
  const s = songs.find(x => x.id === curId);
  ttl.textContent = s ? s.name : 'Nichts ausgewählt';
  const playing = curId && !audio.paused;
  bPlay.innerHTML = svg(playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>', 1);
  bPlay.setAttribute('aria-label', playing ? 'Pause' : 'Abspielen');
  bShuf.setAttribute('aria-pressed', shuffle);
  bRep.setAttribute('aria-pressed', repeat > 0);
  bRep.title = ['Wiederholen: aus', 'Wiederholen: alle', 'Wiederholen: ein Song'][repeat];
  let b = bRep.querySelector('b'); if (b) b.remove();
  if (repeat === 2) bRep.append(h('b', {}, '1'));
}
bPlay.onclick = toggle;
$('#bPrev').onclick = prev;
$('#bNext').onclick = () => next(false);
bShuf.onclick = () => { shuffle = !shuffle; if (curId) build(curId); updateBar(); };
bRep.onclick = () => { repeat = (repeat + 1) % 3; updateBar(); };
$('#vol').oninput = e => audio.volume = +e.target.value;
seek.addEventListener('pointerdown', () => dragging = true);
seek.addEventListener('pointerup', () => dragging = false);
seek.oninput = () => { audio.currentTime = +seek.value; tCur.textContent = fmt(+seek.value); };
audio.addEventListener('timeupdate', () => {
  if (!dragging) { seek.max = audio.duration || 0; seek.value = audio.currentTime; }
  tCur.textContent = fmt(audio.currentTime); tDur.textContent = fmt(audio.duration);
});
audio.addEventListener('play', () => { updateBar(); render(); });
audio.addEventListener('pause', () => { updateBar(); render(); });
audio.addEventListener('ended', () => {
  if (repeat === 2) { audio.currentTime = 0; audio.play(); } else next(true);
});
if ('mediaSession' in navigator) {
  [['play', () => audio.play()], ['pause', () => audio.pause()], ['previoustrack', prev], ['nexttrack', () => next(false)]]
    .forEach(([a, f]) => { try { navigator.mediaSession.setActionHandler(a, f); } catch (e) {} });
}

/* Oberfläche */
const nn = h('input', { placeholder: 'Neue Playlist', maxLength: 40, 'aria-label': 'Name der neuen Playlist', onkeydown: e => { if (e.key === 'Enter') mkList(); } });
const nav = (id, label, n) => h('button', { class: 'nav', 'aria-current': view === id ? 'page' : null, onclick: () => { view = id; armed = null; render(); } }, h('span', {}, label), h('span', { class: 'n' }, String(n)));
function renderSide() {
  $('#side').replaceChildren(
    h('h2', {}, 'Mein Player'),
    nav('all', 'Alle Songs', songs.length),
    ...lists.map(l => nav(l.id, l.name, l.ids.length)),
    h('div', { class: 'new' }, nn, h('button', { class: 'btn', onclick: mkList }, 'Anlegen'))
  );
}
function row(s, i) {
  const on = s.id === curId;
  return h('li', { class: 'row' + (on ? ' on' : '') },
    h('button', { class: 'name', title: 'Abspielen', onclick: () => playFrom(curSongs().map(x => x.id), s.id) },
      h('span', { class: 'idx' }, on && !audio.paused ? '♪' : String(i + 1)), h('span', { class: 't' }, s.name)),
    h('div', { class: 'act' },
      lists.length > 0 && h('select', { 'aria-label': 'Zu Playlist hinzufügen', onchange: e => { if (e.target.value) addTo(e.target.value, s.id); } },
        h('option', { value: '' }, 'Zu Playlist …'), lists.map(l => h('option', { value: l.id }, l.name))),
      view === 'all'
        ? h('button', { class: 'sm' + (armed === 'S' + s.id ? ' warn' : ''), onclick: arm('S' + s.id, () => delSong(s.id)) }, armed === 'S' + s.id ? 'Sicher?' : 'Löschen')
        : h('button', { class: 'sm', onclick: () => rmFrom(s.id) }, 'Entfernen')));
}
function renderMain() {
  const l = lists.find(x => x.id === view), items = curSongs(), ids = items.map(x => x.id);
  const m = $('#main');
  m.replaceChildren(
    h('div', { class: 'head' },
      h('h1', {}, l ? l.name : 'Alle Songs'),
      h('div', { class: 'acts' },
        items.length > 0 && h('button', { class: 'btn pri', onclick: () => { shuffle = false; playFrom(ids); } }, 'Abspielen'),
        items.length > 0 && h('button', { class: 'btn', onclick: () => { shuffle = true; playFrom(ids, ids[Math.floor(Math.random() * ids.length)]); } }, 'Zufällig'),
        view === 'all' && h('button', { class: 'btn', onclick: () => fileIn.click() }, 'Songs hinzufügen'),
        l && h('button', { class: 'btn' + (armed === 'L' ? ' warn' : ''), onclick: arm('L', delList) }, armed === 'L' ? 'Wirklich löschen?' : 'Playlist löschen'))),
    memOnly && h('p', { class: 'note' }, 'Der Browser-Speicher ist nicht verfügbar. Die Songs bleiben nur, bis du die Seite schließt.'),
    items.length
      ? h('ul', {}, items.map(row))
      : h('p', { class: 'empty' }, l
          ? 'Diese Playlist ist leer. Wähle unter „Alle Songs“ bei einem Titel „Zu Playlist …“ aus.'
          : 'Noch keine Songs. Ziehe Audiodateien hierher oder wähle sie über „Songs hinzufügen“ aus.'));
}
function render() { renderSide(); renderMain(); }

fileIn.onchange = () => { addFiles([...fileIn.files]); fileIn.value = ''; };
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });

(async () => {
  songs = ((await db('songs', 'readonly', s => s.getAll())) || []).map(r => ({ id: r.id, name: r.name, added: r.added, blob: r.blob || new Blob([r.data], { type: r.type }) }));
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  lists = (await db('playlists', 'readonly', s => s.getAll())) || [];
  if (!(await dbp)) memOnly = true;
  songs.sort((a, b) => a.added - b.added);
  updateBar(); render();
})();
</script>
</body>
</html>
